            margin-bottom: 8px;
            line-height: 1.3;
        }

            font-size: 0.9em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;

            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);

            padding: 15px;

        { date: '2026-11-28', label: 'Сб' },
        { date: '2026-11-29', label: 'Вс' },
        { date: '2026-11-30', label: 'Пн' },
        { date: '2026-12-01', label: 'Вт' },
        { date: '2026-12-02', label: 'Ср' },
        { date: '2026-12-03', label: 'Чт' },
        { date: '2026-12-04', label: 'Пт' }
    ];

    let currentDay = days[0].date;

    function renderTabs() {
        const nav = document.getElementById('tabsNav');
        nav.innerHTML = days.map(d => {
            const dateObj = new Date(d.date);
            const dayNum = dateObj.getDate().toString().padStart(2, '0');
            const monthNum = (dateObj.getMonth() + 1).toString().padStart(2, '0');
            return `
                <button class="tab-btn ${d.date === currentDay ? 'active' : ''}" onclick="setDay('${d.date}')">
                    <span class="day-name">${d.label}</span>
                    <span class="date-num">${dayNum}.${monthNum}</span>
                </button>
            `;
        }).join('');
    }

    function renderEvents() {
        const container = document.getElementById('eventsList');
        const filtered = events.filter(e => e.date === currentDay);
        filtered.sort((a, b) => a.time.localeCompare(b.time));

        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:60px; color:#999;">На этот день событий не найдено</div>';
        } else {
            container.innerHTML = filtered.map(e => `
                <div class="event-card" onclick="showDetails('${e.date}', '${e.time}', '${e.title.replace(/'/g, "\\'")}')">
                    <div class="event-header">
                        <span class="category">${e.cat}</span>
                        <span class="age-badge">${e.age}</span>
                    </div>
                    <div class="event-title">${e.title}</div>
                    <div class="event-info-line">
                        <span>🕒 ${e.time}</span>
                        <span>📍 ${e.loc}</span>
                    </div>
                </div>
            `).join('');
        }
        sendHeight();
    }

    function setDay(date) {
        currentDay = date;
        renderTabs();
        renderEvents();
    }

    function showDetails(date, time, title) {
        const ev = events.find(e => e.date === date && e.time === time && e.title === title);
        const content = document.getElementById('detailContent');
        
        content.innerHTML = `
            <div class="category" style="margin-bottom:10px">${ev.cat} <span class="age-badge" style="float:right">${ev.age}</span></div>
            <h2 style="margin-top:0; line-height:1.2;">${ev.title}</h2>
            <div class="detail-desc">${ev.desc}</div>
            <div class="info-grid">
                <div class="info-box">
                    <strong>Когда</strong>
                    ${new Date(ev.date).toLocaleDateString('ru-RU', {day:'numeric', month:'long'})}, ${ev.time}
                </div>
                <div class="info-box">
                    <strong>Где</strong>
                    ${ev.loc}
                </div>
            </div>
            <div class="price-tag">Стоимость: ${ev.price}</div>
        `;
        
        document.getElementById('overlay').style.display = 'block';
        document.body.style.overflow = 'hidden';
        sendHeight(); 
    }

    function closeDetails() {
        document.getElementById('overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
        sendHeight();
    }

    function sendHeight() {
        setTimeout(() => {
            const height = document.getElementById('widgetRoot').offsetHeight;
            window.parent.postMessage({ frameHeight: height }, '*');
        }, 80);
    }

    renderTabs();
    renderEvents();
    window.addEventListener('resize', sendHeight);
</script>

</body>
</html>
